# Alertmanager routing.
#
# Prometheus evaluating rules is only half the job: without this, a firing
# alert is a red row in a web UI nobody is looking at.
#
# Alerts go to a Discord channel. The webhook URL is a secret, so it lives in
# monitoring/discord-webhook-url (gitignored, mounted read-only), not here:
#
#   printf '%s' 'https://discord.com/api/webhooks/...' > monitoring/discord-webhook-url
#
# Then send a test alert (see docs/operations.md): an untested paging path is
# discovered at the worst possible moment.

global:
  resolve_timeout: 5m

# Deliberately conservative grouping: alerts for the same service arrive as one
# notification rather than one message per rule, which is how a paging channel
# becomes something people mute.
route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: discord

  routes:
    - matchers:
        - severity = "critical"
      receiver: discord
      # Page fast, and keep reminding: these mean gates are not working.
      group_wait: 10s
      repeat_interval: 1h

    - matchers:
        - severity = "warning"
      receiver: discord
      # Warnings are for working hours, not 03:00.
      repeat_interval: 12h

# Do not page twice for one fault. If the API is down, its error rate and
# latency are consequences, not separate incidents.
inhibit_rules:
  - source_matchers:
      - alertname = "AegisApiDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ["service"]

  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname"]

receivers:
  # One channel for every severity; the routes above set how fast and how
  # often each is sent, and the message lists the severity label.
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/discord-webhook-url
        send_resolved: true
