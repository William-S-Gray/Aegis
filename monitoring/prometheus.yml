# Prometheus scrape configuration for Aegis.
#
#   docker compose --profile monitoring up -d
#
# Prometheus on :9090, Grafana on :3030 (offset to avoid host collisions).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "${ENVIRONMENT:-development}"

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: aegis-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
    # The API refuses to start outside development without METRICS_TOKEN.
    # Write the same value to monitoring/metrics-token (gitignored).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
