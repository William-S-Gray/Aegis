# Full stack. For local development against the host-run servers, use
# backend/api_server/docker-compose.yml instead — that starts only PostgreSQL
# and Redis.
#
#   cp .env.example .env      # set SECRET_KEY and the passwords
#   docker compose up -d --build
#   docker compose run --rm migrate
#
# Ports are offset from the usual defaults to avoid colliding with anything
# already running on the host.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Shared login throttling and WebSocket tickets across API replicas.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend/api_server
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aegis}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      # /metrics is on the published API port, so it is never left open.
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required (see .env.example)}
      # Addresses of the reverse proxy in front of the API. Only these may set
      # X-Forwarded-For; everyone else is identified by their TCP address.
      # Never "*": that lets any client choose the IP the login throttle sees.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Browsers keep the Secure refresh cookie only on https or localhost.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      # Plate-read gating; see .env.example. Unset keeps the measured defaults.
      PLATE_AUTO_ACCEPT_CONFIDENCE: ${PLATE_AUTO_ACCEPT_CONFIDENCE:-0.85}
      PLATE_AUTO_ACCEPT_MIN_WIDTH: ${PLATE_AUTO_ACCEPT_MIN_WIDTH:-120}
      PLATE_FORMATS: ${PLATE_FORMATS:-}
    ports:
      - "${API_PORT:-8081}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # One-shot migration runner. Kept separate from the API so several replicas
  # cannot race to migrate the same database on startup.
  migrate:
    build:
      context: ./backend/api_server
    command: ["alembic", "upgrade", "head"]
    environment:
      # Index builds and backfills are not bound by the API's query limit.
      DB_STATEMENT_TIMEOUT_MS: "0"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aegis}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"

  # Data-retention purge. Run on a schedule (cron/systemd timer/k8s CronJob):
  #     docker compose --profile tools run --rm purge
  # Add --dry-run to the command to preview without deleting.
  purge:
    build:
      context: ./backend/api_server
    command: ["python", "-m", "app.cli", "purge"]
    environment:
      # Batched deletes on a large backlog can exceed the API's query limit.
      DB_STATEMENT_TIMEOUT_MS: "0"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aegis}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      RETENTION_AUDIT_LOG_DAYS: ${RETENTION_AUDIT_LOG_DAYS:-730}
      RETENTION_ACCESS_LOG_DAYS: ${RETENTION_ACCESS_LOG_DAYS:-365}
      RETENTION_ALERT_DAYS: ${RETENTION_ALERT_DAYS:-365}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
    environment:
      # Resolved at container start into config.js, so this image is not tied
      # to a single environment.
      API_URL: ${PUBLIC_API_URL:-http://localhost:8081/api/v1}
      ENABLE_MOCK_AUTH: "false"
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

  vision:
    build:
      context: ./backend/vision_service
    environment:
      VISION_ENVIRONMENT: ${ENVIRONMENT:-production}
      VISION_API_URL: http://api:8000/api/v1
      VISION_SERVICE_EMAIL: ${VISION_SERVICE_EMAIL:-vision@aegis.example}
      VISION_SERVICE_PASSWORD: ${VISION_SERVICE_PASSWORD:?VISION_SERVICE_PASSWORD is required}
      # Real detection by default; "stub" is refused outside development.
      VISION_DETECTOR: ${VISION_DETECTOR:-onnx}
      VISION_READER: ${VISION_READER:-onnx}
      VISION_SOURCES: ${VISION_SOURCES:-/data/samples}
      VISION_PREVIEW_INTERVAL_SECONDS: ${VISION_PREVIEW_INTERVAL_SECONDS:-1}
      VISION_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VISION_LOG_JSON: ${LOG_JSON:-true}
    volumes:
      - ${VISION_DATA_DIR:-./backend/vision_service/samples}:/data/samples:ro
    depends_on:
      - api
    # Opt-in: the service account must exist before this can authenticate.
    profiles: ["vision"]
    restart: unless-stopped

volumes:
  pgdata:
