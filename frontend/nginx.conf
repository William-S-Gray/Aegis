server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hardening. A CSP belongs here too, but it must be written against the
    # real deployment's API origin, so it is left for the operator.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Never cache the shell or the runtime config: both change on every deploy
    # and a stale config.js would point the app at the wrong API.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-store" always;
    }

    # Build output is content-hashed, so it can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths render the shell and let the router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
