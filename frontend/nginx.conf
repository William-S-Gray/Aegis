server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers and the CSP. Repeated in every location below that sets
    # its own add_header, because nginx does not inherit them into those.
    include /etc/nginx/aegis/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Never cache the shell or the runtime config: both change on every deploy
    # and a stale config.js would point the app at the wrong API.
    location = /index.html {
        include /etc/nginx/aegis/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /config.js {
        include /etc/nginx/aegis/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /sw.js {
        include /etc/nginx/aegis/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Build output is content-hashed, so it can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/aegis/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths render the shell and let the router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
