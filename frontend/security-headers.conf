# Included in every block that sets add_header. nginx does not inherit
# add_header into a block that declares its own, so declaring these once at
# server level silently dropped them from every page (all of which are served
# via `location = /index.html`).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Written at container start from API_URL/WS_URL (docker-entrypoint.sh).
include /etc/nginx/conf.d/csp.inc;
