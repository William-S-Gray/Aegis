# HTTPS for production, in front of everything on one origin:
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#
# Requires AEGIS_DOMAIN and AEGIS_TLS in .env (see .env.example). The API's
# and frontend's own ports are closed; only Caddy is published.

services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      AEGIS_DOMAIN: "${AEGIS_DOMAIN:?AEGIS_DOMAIN is required for HTTPS (see .env.example)}"
      AEGIS_TLS: "${AEGIS_TLS:?AEGIS_TLS is required for HTTPS - your email (Let's Encrypt) or internal}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account; losing them means re-issuing.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # Fixed, so the API can trust X-Forwarded-For from this address only.
        ipv4_address: 172.30.57.10
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  api:
    ports: !reset []
    environment:
      # Only Caddy may say which client a request came from (the login
      # throttle keys on it).
      FORWARDED_ALLOW_IPS: 172.30.57.10
      CORS_ORIGINS: ${AEGIS_PUBLIC_URL:-https://${AEGIS_DOMAIN}}

  frontend:
    ports: !reset []
    environment:
      API_URL: ${AEGIS_PUBLIC_URL:-https://${AEGIS_DOMAIN}}/api/v1

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.57.0/24

volumes:
  caddy_data:
  caddy_config:
